# Local parity check for the production image. HostForge deploys the
# Dockerfile directly — this file is only for `docker compose up` testing.
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: committee_management_db
      DB_USERNAME: root
      DB_PASSWORD: root
      # CMAS_APP_URL: http://localhost:8080
      # GEMINI_API_KEY: ...
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: committee_management_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./database/committee_management_db.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "3307:3306"
